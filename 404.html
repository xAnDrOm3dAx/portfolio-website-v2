<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Christopher Werkmeister</title>
  <meta name="description" content="This page does not exist on Christopher Werkmeister’s portfolio.">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F4EFE8">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="images/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&text=C.W.&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css-reset.css">
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="main.css">
  <script>
    (function () {
      document.documentElement.classList.add("js");
      try {
        var stored = localStorage.getItem("theme");
        var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme;
        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) {
          themeColor.setAttribute("content", theme === "dark" ? "#12110F" : "#F4EFE8");
        }
      } catch (error) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="page">
    <header class="site-header">
      <div class="site-header__inner wrap">
        <a class="logo" href="index.html">C.W.<span class="visually-hidden"> Christopher Werkmeister, home</span></a>
      </div>
    </header>

    <main id="main">
      <section class="section" aria-labelledby="not-found-title">
        <div class="wrap">
          <div class="contact-panel">
            <p class="eyebrow">404</p>
            <h1 id="not-found-title">This page isn’t here</h1>
            <p>The address may have changed, or the page may never have existed. The portfolio lives on a single homepage.</p>
            <a class="btn btn--primary" href="index.html">Back to home</a>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
